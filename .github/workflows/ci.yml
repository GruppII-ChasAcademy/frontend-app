name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  web-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Debug lockfile
        run: |
          pwd
          ls -la
          node -e "try{console.log('lockfileVersion:', require('./package-lock.json').lockfileVersion)}catch(e){console.error('No/invalid package-lock.json')}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present -- --ci --runInBand

      - name: Build
        run: npm run build --if-present
